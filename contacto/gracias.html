<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu mensaje!</title>
    <link rel="stylesheet" href="stylecontac.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('../img/fondo.png') center/cover fixed;
            font-family: 'Montserrat', 'Poppins', sans-serif;
            color: #0ff;
        }
        .gracias-container {
            background: rgba(60, 70, 70, 0.95);
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            padding: 40px 30px;
            text-align: center;
            border: 1px solid #0ff;
        }
        .gracias-container h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #0ff;
        }
        .gracias-container p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #f0f0f0;
        }
        .gracias-container a {
            color: #0ff;
            text-decoration: underline;
            font-weight: 500;
        }
        .gracias-container a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="gracias-container">
        <h1>¡Gracias por contactarnos!</h1>
        <p>Tu mensaje ha sido enviado correctamente.<br>
        Pronto nos pondremos en contacto contigo.</p>
        <a href="contacto.html">Volver al formulario</a> |
        <a href="../index.html">Ir al inicio</a>
    </div>
</body>
</html>
